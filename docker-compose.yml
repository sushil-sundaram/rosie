services:
  rosie:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: rosie:latest
    container_name: rosie
    restart: unless-stopped
    # Host networking lets the container reach Ollama, which listens only on
    # 127.0.0.1:11434. Rosie is served on the host's port 3000 (set PORT to change).
    network_mode: host
    # Runs as the unprivileged "rosie" user (uid 1000, built into the image),
    # with a read-only filesystem apart from the data volume.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - PORT=3000
      # Household timezone: used for "today" when a paid bill is logged as an expense
      - TZ=Asia/Kolkata
      - DATABASE_URL=sqlite:///app/data/rosie.db
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
      # Reads receipts and photos. llama3.2-vision no longer loads on current
      # Ollama versions; inkling-2-mini does, but needs more graphics memory
      # than an 8 GB card has, so it runs on the processor (about a minute per photo).
      - OLLAMA_VISION_MODEL=inkling-2-mini
      - OLLAMA_VISION_NUM_GPU=0
      # Reads PDF invoices, pasted recipes and pages without recipe data.
      # Picked from the installed models by testing on a real Swiggy invoice:
      # clean item names and the right shop name in ~30-50 s (qwen2.5:7b is
      # faster at ~10 s but keeps brand names and picks the seller's legal name).
      - OLLAMA_TEXT_MODEL=nemotron-3.5-lightning
      - RUST_LOG=info
      # Optional household passphrase for sign-in (disabled when unset).
      # - ROSIE_PASSWORD=change-me
      # Extra host names or suffixes allowed to serve Rosie (IP addresses, localhost,
      # *.local, *.lan, and *.home.arpa always work; add *.your-tailnet.ts.net if using Tailscale MagicDNS).
      # - ALLOWED_HOSTS=*.your-tailnet.ts.net,rosie.example.home
      # Set TRUST_PROXY=1 if terminating HTTPS behind a non-loopback reverse proxy.
      # - TRUST_PROXY=1
    volumes:
      # :Z relabels for SELinux (Fedora) so the container can write the DB
      - ./data:/app/data:Z
